services:
  postgres:
    container_name: order-service-db
    image: postgres:14.22
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: order_db
    volumes:
      - order-service-db-data:/var/lib/postgresql/data
volumes:
  order-service-db-data:
